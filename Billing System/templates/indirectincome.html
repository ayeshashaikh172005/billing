<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indirect Income</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .form-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .input-group {
            position: relative;
            margin-bottom: 2.5rem; /* Increased margin for larger labels */
        }
        .input-label {
            position: absolute;
            top: -16px; /* Adjusted further for much larger font */
            left: 12px;
            background: white;
            padding: 0 8px;
            font-size: 1.1rem; /* Significantly increased from 0.9rem */
            color: #475569; /* Darker slate for better visibility */
            font-weight: 600;
            z-index: 1;
        }
        .custom-input {
            width: 100%;
            padding: 18px 16px; /* Increased padding for the larger font */
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
            color: #0f172a;
            font-size: 1.4rem; /* Significantly increased from 1.15rem */
        }
        .custom-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        /* Date picker custom styling to hide default icon but keep functionality */
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
        }
        .toggle-switch {
            width: 44px;
            height: 22px;
            background: #e2e8f0;
            border-radius: 11px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: #3b82f6;
        }
        .toggle-knob {
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        .toggle-switch.active .toggle-knob {
            transform: translateX(22px);
        }
        /* Increased padding and font size for larger chips */
        .chip {
            padding: 12px 68px;
            border-radius: 30px;
            background: white;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            color: #323a44;
        }
        .chip.selected {
            background: #eefcf5;
            color: #059669;
            border-color: #10b981;
            font-weight: 500;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.1);
        }
        .sticky-footer {
            margin-top: auto;
            padding: 20px;
            background: white;
            border-top: 1px solid #edf2f7;
            display: flex;
            justify-content: flex-end;
        }
        /* Scrollbar styling for better desktop look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .description-textarea {
            font-size: 1.1rem !important;
        }
        /* Large Attachment Buttons */
        .attachment-btn {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 2px dashed #e2e8f0;
            border-radius: 16px;
            padding: 48px 24px; /* Increased vertical size */
            color: #2563eb;
            font-weight: 600;
            font-size: 1.25rem; /* Larger font */
            transition: all 0.2s;
            background: white;
        }
        .attachment-btn:hover {
            border-color: #3b82f6;
            background: #f0f7ff;
        }
        .attachment-btn i {
            font-size: 3rem; /* Much larger icons */
        }
    </style>
</head>
<body>

<div class="form-container">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b sticky top-0 bg-white z-20">
        <div class="flex items-center gap-6">
            <i class="fa-solid fa-arrow-left text-lg cursor-pointer hover:text-blue-600 transition-colors" onclick="window.location.href='dashboard.html'"></i>
            <h1 class="text-2xl font-bold text-gray-800">Create Indirect Income</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="hidden md:inline text-sm text-gray-500 font-medium">Draft saved at 10:55 AM</span>
            <div class="text-red-500 cursor-pointer hover:scale-110 transition-transform">
                <i class="fa-solid fa-circle-play text-2xl"></i>
            </div>
        </div>
    </header>

    <main class="p-6 md:p-10 max-w-[1400px] mx-auto w-full flex-grow">
        <!-- Top Row Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-8">
            <!-- Amount -->
            <div class="input-group">
                <span class="input-label">Enter Income Amount</span>
                <input type="number" class="custom-input text-2xl" placeholder="0.00" value="0.00">
            </div>

            <!-- Expense Date -->
            <div class="input-group">
                <span class="input-label">Income Date</span>
                <div class="relative">
                    <input type="date" class="custom-input" id="purchaseDate" value="2026-02-07">
                    <i class="fa-solid fa-calendar-days absolute right-4 top-1/2 -translate-y-1/2 calendar-icon"></i>
                </div>
            </div>

            <!-- Category -->
            <div class="input-group">
                <span class="input-label">Select Category</span>
                <div class="relative">
                    <select class="custom-input appearance-none bg-white">
                        <option>Select Category</option>
                        <option>Food & Dining</option>
                        <option>Travel</option>
                        <option>Bills</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 select-arrow"></i>
                </div>
            </div>
        </div>

        <!-- Middle Row Grid: Toggles -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-8">
             <!-- TDS Toggle -->
             <div class="flex items-center justify-between p-4 border border-gray-100 rounded-xl bg-gray-50 lg:bg-transparent lg:border-none lg:p-0">
                <div class="flex items-center gap-3">
                    <div id="tdsToggle" class="toggle-switch">
                        <div class="toggle-knob"></div>
                    </div>
                    <span class="text-lg text-gray-400 font-medium w-8" id="tdsLabel">No</span>
                    <span class="text-xl font-semibold text-gray-700">TDS applicable?</span>
                </div>
            </div>

            <!-- Paid Status -->
            <div class="flex items-center justify-between p-4 border border-gray-100 rounded-xl bg-gray-50 lg:bg-transparent lg:border-none lg:p-0">
                <div class="flex items-center gap-3">
                    <div id="paidToggle" class="toggle-switch active">
                        <div class="toggle-knob"></div>
                    </div>
                    <span class="text-lg text-blue-600 font-medium w-8" id="paidLabel">Yes</span>
                    <span class="text-xl font-semibold text-gray-700">Mark as Paid</span>
                </div>
            </div>
        </div>

        <!-- Payment Type Section -->
        <div class="mb-10 p-6 bg-slate-50 rounded-2xl border border-slate-100">
            <span class="text-xl font-bold text-slate-700 block mb-6">Select Payment Type <span class="text-red-500">*</span></span>
            <div class="flex flex-wrap gap-3">
                <div class="chip bg-white border-slate-200" data-type="upi">UPI</div>
                <div class="chip selected" data-type="cash">
                    <i class="fa-solid fa-check text-xs"></i> Cash
                </div>
                <div class="chip bg-white border-slate-200" data-type="card">Credit Card</div>
                <div class="chip bg-white border-slate-200" data-type="netbanking">Net Banking</div>
                <div class="chip bg-white border-slate-200" data-type="cheque">Cheque</div>
                <div class="chip bg-white border-slate-200" data-type="emi">EMI</div>
            </div>
        </div>

        <!-- Payment Details Grid -->
        <div class="flex flex-col md:flex-row justify-between items-end gap-12 mb-12">
            <div class="input-group mb-0 w-full md:w-1/3">
                <span class="input-label">Payment date</span>
                <div class="relative">
                    <input type="date" class="custom-input" id="paymentDate" value="2026-02-07">
                    <i class="fa-solid fa-calendar-days absolute right-4 top-1/2 -translate-y-1/2 calendar-icon"></i>
                </div>
            </div>

            <div class="flex items-center">
                <button class="flex items-center gap-2 text-blue-600 font-bold text-sm px-6 py-4 rounded-lg border border-blue-200 hover:bg-blue-50 transition-colors">
                    <i class="fa-solid fa-circle-plus"></i>
                    <span>Add Bank Account Details</span>
                </button>
            </div>
        </div>

        <!-- Description and Attachments (Stacked vertically) -->
        <div class="flex flex-col gap-12">
            <!-- Description: Full Line -->
            <div class="input-group mb-0">
                <span class="input-label">Description</span>
                <textarea class="custom-input min-h-[160px] resize-none description-textarea" placeholder="Enter detailed expense description..."></textarea>
            </div>

            <!-- Attachments: Below Description -->
            <div class="space-y-6">
                <span class="text-2xl font-bold text-slate-700 block">Attachments & Receipts</span>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
                    <!-- Upload Files on Left -->
                    <button class="flex attachment-btn">
                        <i class="fa-solid fa-upload"></i>
                        <span>Upload Files</span>
                    </button>
                    <!-- Take Photo on Right -->
                    <button class="flex attachment-btn">
                        <i class="fa-solid fa-camera-retro"></i>
                        <span>Take Photo</span>
                    </button>
                </div>
                <p class="text-lg text-slate-400">Supported formats: PDF, JPG, PNG (Max 5MB)</p>
            </div>
        </div>
    </main>
    <!-- Fixed Footer -->
    <footer class="sticky-footer bg-white shadow-[0_-4px_10px_-2px_rgba(0,0,0,0.05)] px-10">
        <div class="flex gap-4 w-full lg:w-auto">
            <button class="px-8 py-3 rounded-xl font-bold text-gray-500 hover:bg-gray-100 transition-colors hidden md:block">
                Save Draft
            </button>
            <button id="createBtn" class="flex-grow lg:flex-none lg:px-16 bg-blue-600 text-white rounded-xl py-4 font-bold flex items-center justify-center gap-2 hover:bg-blue-700 transition-all shadow-lg active:scale-95">
                Create Expense <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>
    </footer>
</div>

<script>
    // Toggle Logic
    const setupToggle = (elementId, labelId) => {
        const toggle = document.getElementById(elementId);
        const label = document.getElementById(labelId);
        
        toggle.addEventListener('click', () => {
            toggle.classList.toggle('active');
            const isActive = toggle.classList.contains('active');
            label.innerText = isActive ? 'Yes' : 'No';
            label.style.color = isActive ? '#2563eb' : '#9ca3af';
        });
    };

    setupToggle('tdsToggle', 'tdsLabel');
    setupToggle('paidToggle', 'paidLabel');

    // Chip Selection Logic
    const chips = document.querySelectorAll('.chip');
    chips.forEach(chip => {
        chip.addEventListener('click', () => {
            chips.forEach(c => {
                c.classList.remove('selected');
                const check = c.querySelector('.fa-check');
                if (check) check.remove();
            });
            chip.classList.add('selected');
            const icon = document.createElement('i');
            icon.className = 'fa-solid fa-check text-xs';
            chip.prepend(icon);
        });
    });

    // Form Submission Visual Feedback
    document.getElementById('createBtn').addEventListener('click', () => {
        const btn = document.getElementById('createBtn');
        const originalContent = btn.innerHTML;
        
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
        btn.disabled = true;
        
        setTimeout(() => {
            btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Expense Created!';
            btn.classList.replace('bg-blue-600', 'bg-green-600');
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.replace('bg-green-600', 'bg-blue-600');
                btn.disabled = false;
            }, 2500);
        }, 1500);
    });
</script>

</body>
</html>
