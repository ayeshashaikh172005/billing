<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techcraftery Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --navy-1: #000b3d;
            --navy-2: #00145f;
            --line: rgba(255, 255, 255, 0.35);
            --line-soft: rgba(255, 255, 255, 0.18);
        }

        body {
            background: radial-gradient(circle at 10% 10%, #0c2a87 0%, var(--navy-2) 35%, var(--navy-1) 100%);
            color: #ffffff;
            font-family: Inter, Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .glass-navy {
            background: #ffffff;
            border: 1px solid #dbeafe;
            box-shadow: 0 14px 40px rgba(2, 6, 23, 0.15);
            backdrop-filter: blur(4px);
            color: #0f172a;
        }

        .glass-navy [class*="text-white"] {
            color: #0f172a !important;
        }

        .glass-navy [class*="border-white"] {
            border-color: #cbd5e1 !important;
        }

        .glass-navy .auth-mode-btn {
            color: #00145f !important;
        }

        .glass-navy .auth-mode-btn:hover {
            color: #ffffff !important;
        }

        .glass-navy .auth-submit-btn {
            color: #00145f !important;
        }

        .glass-navy .auth-submit-btn:hover {
            color: #ffffff !important;
        }

        .input-navy {
            background: #ffffff;
            border: 1px solid #94a3b8;
            color: #0f172a;
        }

        .input-navy::placeholder {
            color: #64748b;
        }

        .input-navy:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 1px #2563eb inset;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useMemo, useState } = React;

        function App() {
            const [mode, setMode] = useState("login");
            const [role, setRole] = useState("user");
            const [formData, setFormData] = useState({ name: "", email: "", password: "" });
            const [msg, setMsg] = useState({ type: "", text: "" });
            const [loading, setLoading] = useState(false);

            const title = useMemo(() => {
                return `${role === "admin" ? "Admin" : "User"} ${mode === "login" ? "Login" : "Register"}`;
            }, [mode, role]);

            const updateField = (key, value) => {
                setFormData((prev) => ({ ...prev, [key]: value }));
            };

            const submit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setMsg({ type: "", text: "" });

                const endpoint = mode === "login" ? "/login-direct" : "/register";
                const payload = {
                    name: formData.name,
                    email: formData.email,
                    password: formData.password,
                    role: role
                };

                try {
                    const res = await fetch(endpoint, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        setMsg({ type: "error", text: data.error || "Request failed" });
                        return;
                    }

                    if (mode === "login") {
                        const role = (data?.user?.role || "user").toString().toLowerCase();
                        window.location.href = role === "admin" ? "/admin/users" : "/dashboard";
                        return;
                    }

                    const newRole = (data?.user?.role || role || "user").toString().toLowerCase();
                    window.location.href = newRole === "admin" ? "/admin/users" : "/dashboard";
                    return;
                } catch (_) {
                    setMsg({ type: "error", text: "Unable to connect. Try again." });
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen w-full px-4 py-6 md:px-8 md:py-10">
                    <div className="mx-auto w-full max-w-[1300px] min-h-[86vh] glass-navy rounded-3xl border border-white/20 overflow-hidden">
                        <div className="grid grid-cols-1 lg:grid-cols-2 min-h-[86vh]">
                            <section className="relative border-b lg:border-b-0 lg:border-r border-white/20 p-8 md:p-12 flex flex-col justify-between">
                                <div className="space-y-5 text-center">
                                    <h1 className="text-4xl md:text-5xl font-black leading-tight">Techcraftery</h1>
                                    <p className="text-white/80 text-base md:text-lg max-w-xl mx-auto">
                                        Secure Login Panel For Billing Operations.
                                    </p>
                                </div>

                                <div className="flex-1 flex items-center justify-center py-10">
                                    <img
                                        src="/static/logo2.jpg"
                                        alt="Techcraftery Logo"
                                        className="w-full max-w-[420px] h-auto object-contain rounded-2xl border border-white/30 p-4 bg-white/5"
                                    />
                                </div>

                                <p className="text-sm text-white/60 font-semibold">Billing System | Secure Node</p>
                            </section>

                            <section className="p-8 md:p-12 flex flex-col justify-center">
                                <div className="max-w-md w-full mx-auto">
                                    <div className="inline-flex p-1 rounded-xl border border-white/35 bg-white/5 mb-5">
                                        <button
                                            type="button"
                                            onClick={() => setMode("login")}
                                            className={`auth-mode-btn px-6 py-2 rounded-lg text-sm font-bold tracking-wider transition-colors text-[#00145f] hover:bg-[#00145f] hover:text-white ${mode === "login" ? "bg-white" : ""}`}
                                        >
                                            LOGIN
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setMode("register")}
                                            className={`auth-mode-btn px-6 py-2 rounded-lg text-sm font-bold tracking-wider transition-colors text-[#00145f] hover:bg-[#00145f] hover:text-white ${mode === "register" ? "bg-white" : ""}`}
                                        >
                                            REGISTER
                                        </button>
                                    </div>

                                    <h2 className="text-3xl font-black mb-6">{title}</h2>

                                    {msg.text && (
                                        <div className={`mb-5 rounded-xl border px-4 py-3 text-sm font-semibold ${msg.type === "success" ? "border-white bg-white/10 text-white" : "border-red-200 bg-red-500/20 text-white"}`}>
                                            {msg.text}
                                        </div>
                                    )}

                                    <form onSubmit={submit} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-[0.2em] text-white/75 mb-2">Role</label>
                                            <select
                                                value={role}
                                                onChange={(e) => setRole(e.target.value)}
                                                className="input-navy w-full rounded-xl px-4 py-3 text-sm font-semibold"
                                            >
                                                <option value="user" className="text-black">User</option>
                                                <option value="admin" className="text-black">Admin</option>
                                            </select>
                                        </div>

                                        {mode === "register" && (
                                            <div>
                                                <label className="block text-xs font-bold uppercase tracking-[0.2em] text-white/75 mb-2">Full Name</label>
                                                <input
                                                    type="text"
                                                    required
                                                    value={formData.name}
                                                    onChange={(e) => updateField("name", e.target.value)}
                                                    className="input-navy w-full rounded-xl px-4 py-3 text-sm font-semibold"
                                                    placeholder={role === "admin" ? "Admin Full Name" : "User Full Name"}
                                                />
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-[0.2em] text-white/75 mb-2">Email</label>
                                            <input
                                                type={mode === "login" ? "text" : "email"}
                                                required
                                                value={formData.email}
                                                onChange={(e) => updateField("email", e.target.value)}
                                                className="input-navy w-full rounded-xl px-4 py-3 text-sm font-semibold"
                                                placeholder={mode === "login" ? (role === "admin" ? "Admin Email I'd" : "User Email I'd") : (role === "admin" ? "admin@company.com" : "user@company.com")}
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-[0.2em] text-white/75 mb-2">Password</label>
                                            <input
                                                type="password"
                                                required
                                                value={formData.password}
                                                onChange={(e) => updateField("password", e.target.value)}
                                                className="input-navy w-full rounded-xl px-4 py-3 text-sm font-semibold"
                                                placeholder="Enter Secure Password"
                                            />
                                        </div>

                                        <button
                                            type="submit"
                                            disabled={loading}
                                            className="auth-submit-btn w-full rounded-xl py-3.5 border border-white bg-white text-[#00145f] text-sm font-black tracking-[0.2em] transition-colors hover:bg-[#00145f] hover:text-white disabled:opacity-60 disabled:cursor-not-allowed"
                                        >
                                            {loading ? "PLEASE WAIT..." : `${mode === "login" ? "LOGIN" : "REGISTER"} ${role === "admin" ? "ADMIN" : "USER"}`}
                                        </button>
                                    </form>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
