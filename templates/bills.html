<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bills</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        html {
            font-size: 19px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-active {
            color: #2563eb;
            border-bottom: 3px solid #2563eb;
        }
        .bottom-nav-item.active {
            color: #1e293b;
            font-weight: 600;
        }
        .bottom-nav-item.active i {
            color: #1e293b;
        }
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.4);
            transition: opacity 0.3s ease;
        }
        .modal-content {
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }
        .modal-open .modal-content {
            transform: translateY(0);
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        .pill-active {
            background-color: #2563eb !important;
            color: white !important;
            border-color: #2563eb !important;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden" onclick="closeAllDropdowns()">

    <!-- Top Navigation Tabs -->
    <header class="bg-white pt-4 shadow-sm z-10">
        <div class="flex justify-around items-center px-4 border-b">
            <button onclick="switchMainTab('sales')" id="tab-sales" class="pb-3 px-2 text-sm font-medium tab-active transition-all">Sales</button>
            <button onclick="switchMainTab('purchases')" id="tab-purchases" class="pb-3 px-2 text-sm font-medium text-gray-500 transition-all">Purchases</button>
            <button onclick="switchMainTab('quotations')" id="tab-quotations" class="pb-3 px-2 text-sm font-medium text-gray-500 transition-all">Quotations</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto pb-24">
        
        <!-- Search and FY Section -->
        <div class="bg-white p-4">
            <div class="bg-gray-50 rounded-lg p-2 flex items-center shadow-inner mb-4">
                <i class="fa-solid fa-magnifying-glass text-gray-400 ml-2"></i>
                <input type="text" placeholder="Search..." class="bg-transparent border-none focus:ring-0 text-sm flex-1 px-2 py-1">
                <button onclick="openDateModal(); event.stopPropagation();" class="flex items-center gap-1 font-bold text-gray-700 pr-2 whitespace-nowrap">
                    <span id="display-fy">FY 25-26</span>
                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </button>
            </div>

            <!-- Summary Card -->
            <div id="summary-card" class="border border-gray-100 rounded-xl p-4 bg-white shadow-sm mb-4">
                <div class="flex justify-between items-start mb-4">
                    <div class="relative">
                        <button onclick="toggleTotalDropdown(event)" class="flex items-center gap-1 text-gray-600 text-xs font-medium uppercase tracking-wider hover:text-blue-600 transition-colors">
                            <span id="total-label">Total Amount</span> <i class="fa-solid fa-chevron-down text-[8px]"></i>
                        </button>
                        <div id="total-amount-value" class="text-xl font-bold mt-1">INR 0.00</div>
                    </div>
                    <div class="text-right">
                        <div class="text-gray-600 text-xs font-medium uppercase tracking-wider">Pending</div>
                        <div id="pending-amount-value" class="text-xl font-bold text-red-500 mt-1">INR 0.00</div>
                    </div>
                </div>
                <div class="flex justify-between items-center pt-3 border-t border-gray-50">
                    <div class="flex items-center gap-1 text-gray-600 text-xs font-medium">
                        Paid Amount <i class="fa-solid fa-check text-[10px] text-green-500"></i>
                    </div>
                    <div id="paid-amount-value" class="text-lg font-bold text-green-600">INR 0.00</div>
                </div>
            </div>

            <!-- Transaction Filters -->
            <div id="transaction-filters" class="flex gap-2 overflow-x-auto no-scrollbar py-2 mb-2">
                <button onclick="switchTransactionFilter(this)" class="pill-active whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium border border-blue-600 transition-all">All Transactions</button>
                <button onclick="switchTransactionFilter(this)" class="bg-gray-100 whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium text-gray-600 border border-transparent transition-all">Paid</button>
                <button onclick="switchTransactionFilter(this)" class="bg-gray-100 whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium text-gray-600 border border-transparent transition-all">Pending</button>
                <button onclick="switchTransactionFilter(this)" class="bg-gray-100 whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium text-gray-600 border border-transparent transition-all">Cancelled</button>
            </div>

            <div class="flex justify-between items-center text-xs text-gray-500 mt-2">
                <button class="flex items-center gap-1">
                    <i class="fa-solid fa-sliders"></i> Filter
                </button>
                <button class="flex items-center gap-1 uppercase tracking-tight">
                    <i class="fa-solid fa-code-compare rotate-90"></i> Default
                </button>
            </div>
        </div>

        <!-- Banner -->
        <div class="px-4 mt-4">
            <div class="bg-blue-50 rounded-xl p-4 relative flex items-start gap-3 border border-blue-100">
                <div class="flex-1">
                    <h3 class="font-bold text-gray-800 text-sm">One-click</h3>
                    <h4 class="font-bold text-gray-800 text-sm mb-1">e-Invoicing & e-Way bills</h4>
                    <p class="text-gray-500 text-xs leading-relaxed">Make instantly from web and mobile. You'll love it!</p>
                </div>
                <div class="text-blue-600">
                    <i class="fa-solid fa-headset text-2xl"></i>
                </div>
            </div>
        </div>

        <div id="bills-list" class="px-4 mt-6 space-y-3 hidden"></div>

        <!-- Empty State Content -->
        <div id="empty-state" class="px-4 mt-8 text-center">
            <p class="text-gray-500 text-sm mb-4 leading-relaxed">
                There are no invoices for <strong id="empty-state-fy">FY 25-26</strong>. Please choose different dates or create a new invoice.
            </p>
            <button onclick="openDateModal()" class="text-blue-600 font-bold text-sm block mx-auto mb-6">Select Date Range</button>
            <span class="text-gray-400 text-xs block mb-6">OR</span>
            <button id="empty-state-btn" onclick="handleCreateNavigation()" class="text-blue-600 font-bold text-sm block mx-auto uppercase">Create Invoice</button>
        </div>
    </main>

    <!-- Floating Action Button -->
    <div class="fixed bottom-24 right-4 z-20">
        <button id="fab-button" onclick="handleCreateNavigation()" class="bg-blue-600 text-white rounded-full px-6 py-4 flex items-center gap-2 shadow-xl hover:bg-blue-700 transition-all active:scale-95">
            <i class="fa-solid fa-plus text-xl"></i>
            <span id="fab-text" class="font-bold text-sm tracking-wide">INVOICE</span>
        </button>
    </div>

    <!-- Date Filter Modal -->
    <div id="date-modal" class="fixed inset-0 z-50 modal-overlay hidden flex flex-col justify-end" onclick="closeDateModal(event)">
        <div id="modal-content" class="modal-content bg-white rounded-t-3xl p-6 shadow-2xl max-h-[85vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6"></div>
            
            <h2 class="text-xl font-bold text-gray-900 mb-6">Date Filter</h2>

            <div class="space-y-4" id="date-options-container">
                <!-- FY Option 25-26 -->
                <div class="filter-option" data-value="FY 25-26">
                    <label class="flex items-center gap-4 cursor-pointer p-1">
                        <input type="radio" name="fy-filter" value="FY 25-26" class="w-5 h-5 text-blue-600 border-gray-300">
                        <div class="flex-1">
                            <span class="font-bold text-gray-800">FY 25-26 <span class="text-blue-600 ml-1 default-tag hidden">(Default)</span></span>
                            <div class="text-gray-400 text-sm">01-04-2025 <i class="fa-solid fa-arrow-right text-[10px] mx-1"></i> 31-03-2026</div>
                            <div class="mt-2 set-default-container hidden">
                                <button onclick="setDefaultAndApply('FY 25-26')" class="bg-yellow-100 text-yellow-800 text-[10px] px-2 py-0.5 rounded font-bold uppercase hover:bg-yellow-200 transition-colors">Set as Default</button>
                            </div>
                        </div>
                    </label>
                </div>

                <!-- FY Option 24-25 -->
                <div class="filter-option" data-value="FY 24-25">
                    <label class="flex items-center gap-4 cursor-pointer p-1">
                        <input type="radio" name="fy-filter" value="FY 24-25" class="w-5 h-5 text-blue-600 border-gray-300">
                        <div class="flex-1">
                            <span class="font-medium text-gray-600">FY 24-25 <span class="text-blue-600 ml-1 default-tag">(Default)</span></span>
                            <div class="mt-2 set-default-container hidden">
                                <button onclick="setDefaultAndApply('FY 24-25')" class="bg-yellow-100 text-yellow-800 text-[10px] px-2 py-0.5 rounded font-bold uppercase hover:bg-yellow-200 transition-colors">Set as Default</button>
                            </div>
                        </div>
                    </label>
                </div>
                    <script>
                        const standardOptions = ["Today", "Yesterday", "This Week", "Last Week", "This Month", "Last Month", "This Year", "Last Year", "Last Quarter", "Custom"];
                        standardOptions.forEach(opt => {
                            document.write(`
                                <div class="filter-option" data-value="${opt}">
                                    <label class="flex items-center gap-4 text-gray-600 font-medium cursor-pointer">
                                        <input type="radio" name="fy-filter" value="${opt}" class="w-5 h-5 border-gray-300">
                                        <div class="flex-1">
                                            <span>${opt} <span class="text-blue-600 ml-1 default-tag hidden">(Default)</span></span>
                                            <div class="mt-2 set-default-container hidden">
                                                <button onclick="setDefaultAndApply('${opt}')" class="bg-yellow-100 text-yellow-800 text-[10px] px-2 py-0.5 rounded font-bold uppercase hover:bg-yellow-200 transition-colors">Set as Default</button>
                                            </div>
                                        </div>
                                    </label>
                                </div>
                            `);
                        });
                    </script>
                </div>
            </div>

            <button onclick="applyDateFilter()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg mt-4 uppercase tracking-wider sticky bottom-0 active:bg-blue-700">Apply</button>
        </div>
    </div>

    <script>
        let currentFilter = "FY 25-26";
        let defaultFilter = "FY 24-25";
        let currentTab = "sales";
        let currentTxFilter = "All Transactions";
        const DOC_TYPES_BY_TAB = {
            sales: ["invoice", "challan", "credit_note", "proforma", "indirect_income"],
            purchases: ["purchase", "purchase_order", "expenses"],
            quotations: ["quotation"]
        };
        const CREATE_PAGE_BY_TAB = {
            sales: "invoice.html",
            purchases: "purchase.html",
            quotations: "quotation.html"
        };
        const EDIT_PAGE_BY_DOC = {
            invoice: "invoice.html",
            purchase: "purchase.html",
            quotation: "quotation.html",
            challan: "challan.html",
            credit_note: "creditnote.html",
            purchase_order: "porder.html",
            expenses: "expenses.html",
            proforma: "proforma.html",
            indirect_income: "indirectincome.html"
        };
        let currentBills = [];
        let canManageBills = false;

        async function apiJson(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error("Request failed");
            return res.json();
        }

        function formatMoney(v) {
            return `INR ${Number(v || 0).toFixed(2)}`;
        }

        function escapeHtml(str) {
            return (str || "").toString()
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function docLabel(t) {
            return (t || "").replaceAll("_", " ").toUpperCase();
        }

        // Tab Switching Logic
        function switchMainTab(tabName) {
            const tabs = ['sales', 'purchases', 'quotations'];
            const fabText = document.getElementById('fab-text');
            const summaryCard = document.getElementById('summary-card');
            const emptyStateBtn = document.getElementById('empty-state-btn');
            currentTab = tabName;

            tabs.forEach(t => {
                const element = document.getElementById(`tab-${t}`);
                element.classList.toggle('tab-active', t === tabName);
                element.classList.toggle('text-gray-500', t !== tabName);
            });

            if (tabName === 'sales') { 
                fabText.innerText = 'INVOICE'; 
                emptyStateBtn.innerText = 'Create Invoice';
                summaryCard.style.display = 'block'; 
            }
            else if (tabName === 'purchases') { 
                fabText.innerText = 'PURCHASE'; 
                emptyStateBtn.innerText = 'Create Purchase';
                summaryCard.style.display = 'block'; 
            }
            else if (tabName === 'quotations') { 
                fabText.innerText = 'ESTIMATE'; 
                emptyStateBtn.innerText = 'Create Quotation';
                summaryCard.style.display = 'none'; 
            }
            
            updateFilterDisplay();
            loadBillsForCurrentTab();
        }

        // Transaction Filter Pills Logic
        function switchTransactionFilter(btn) {
            const buttons = document.querySelectorAll('#transaction-filters button');
            buttons.forEach(b => {
                b.classList.remove('pill-active');
                b.classList.add('bg-gray-100', 'text-gray-600', 'border-transparent');
            });
            btn.classList.add('pill-active');
            btn.classList.remove('bg-gray-100', 'text-gray-600', 'border-transparent');
            currentTxFilter = btn.innerText.trim();
            loadBillsForCurrentTab();
        }

        // Total Amount Dropdown Logic
        function toggleTotalDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('total-dropdown');
            dropdown.classList.toggle('show');
        }

        function closeAllDropdowns() {
            const totalDropdown = document.getElementById('total-dropdown');
            if (totalDropdown) totalDropdown.classList.remove('show');
        }

        function updateTotalType(label) {
            document.getElementById('total-label').innerText = label;
            closeAllDropdowns();
        }

        // Navigation Logic
        function handleCreateNavigation() {
            window.location.href = CREATE_PAGE_BY_TAB[currentTab] || 'invoice.html';
        }

        function cardHtml(row) {
            const num = row.number || "-";
            const date = row.date || "-";
            const total = formatMoney(row.total_amount);
            const actionBtns = canManageBills
                ? `
                        <button onclick="editBill(${row.id}, '${row.doc_type}')" class="text-xs font-semibold text-blue-600 hover:underline">Edit</button>
                        <button onclick="deleteBill(${row.id}, '${row.doc_type}')" class="text-xs font-semibold text-red-600 hover:underline">Delete</button>
                  `
                : "";
            return `
                <div class="bg-white border border-gray-100 rounded-xl p-4 shadow-sm">
                    <div class="flex items-start justify-between">
                        <div>
                            <p class="font-bold text-gray-800">${num}</p>
                            <p class="text-xs text-gray-500 mt-1">${date} | ${docLabel(row.doc_type)}</p>
                        </div>
                        <p class="font-black text-blue-700">${total}</p>
                    </div>
                    <div class="flex items-center gap-3 mt-3 pt-3 border-t border-gray-100">
                        <button onclick="viewBill(${row.id}, '${row.doc_type}')" class="text-xs font-semibold text-gray-600 hover:underline">View</button>
                        ${actionBtns}
                        <button onclick="downloadBillPdf(${row.id}, '${row.doc_type}')" class="text-xs font-semibold text-emerald-600 hover:underline">PDF</button>
                    </div>
                </div>
            `;
        }

        function findBill(id, docType) {
            return currentBills.find((r) => Number(r.id) === Number(id) && r.doc_type === docType);
        }

        function viewBill(id, docType) {
            const row = findBill(id, docType);
            if (!row) return;
            const itemText = (row.items || [])
                .map((i) => `- ${i.product_name || "Item"} | Qty: ${i.quantity || 0} | Rate: ${i.unit_price || 0}`)
                .join("\n") || "- No items";
            alert(
                `Type: ${docLabel(docType)}\nNo: ${row.number || "-"}\nDate: ${row.date || "-"}\nTotal: ${formatMoney(row.total_amount)}\n\nItems:\n${itemText}`
            );
        }

        function editBill(id, docType) {
            if (!canManageBills) {
                alert("You are not allowed to edit bills");
                return;
            }
            const row = findBill(id, docType);
            if (!row) return;
            const page = EDIT_PAGE_BY_DOC[docType] || "invoice.html";
            const number = encodeURIComponent(row.number || "");
            window.location.href = `${page}?number=${number}`;
        }

        async function deleteBill(id, docType) {
            if (!canManageBills) {
                alert("You are not allowed to delete bills");
                return;
            }
            const row = findBill(id, docType);
            if (!row) return;
            if (!confirm(`Delete ${docLabel(docType)} "${row.number || id}"?`)) return;
            try {
                await fetch(`/api/docs/${docType}/${id}`, { method: "DELETE" });
                await loadBillsForCurrentTab();
            } catch (_) {
                alert("Delete failed");
            }
        }

        function downloadBillPdf(id, docType) {
            window.open(`/api/docs/${docType}/${id}/pdf`, "_blank");
        }

        async function loadBillsForCurrentTab() {
            const types = DOC_TYPES_BY_TAB[currentTab] || ["invoice"];
            const all = [];
            for (const t of types) {
                try {
                    const rows = await apiJson(`/api/docs/${t}`);
                    rows.forEach(r => all.push({ ...r, doc_type: t }));
                } catch (_) {}
            }

            let filtered = all;
            if (currentTxFilter === "Paid") filtered = all.filter(r => String(r?.meta?.status || "").toLowerCase() === "paid");
            if (currentTxFilter === "Pending") filtered = all.filter(r => String(r?.meta?.status || "").toLowerCase() !== "paid");
            currentBills = filtered;

            const listEl = document.getElementById("bills-list");
            const emptyEl = document.getElementById("empty-state");
            if (filtered.length) {
                listEl.innerHTML = filtered.map(cardHtml).join("");
                listEl.classList.remove("hidden");
                emptyEl.classList.add("hidden");
            } else {
                listEl.innerHTML = "";
                listEl.classList.add("hidden");
                emptyEl.classList.remove("hidden");
            }

            const total = filtered.reduce((s, r) => s + Number(r.total_amount || 0), 0);
            const paid = filtered
                .filter(r => String(r?.meta?.status || "").toLowerCase() === "paid")
                .reduce((s, r) => s + Number(r.total_amount || 0), 0);
            const pending = Math.max(0, total - paid);
            document.getElementById("total-amount-value").innerText = formatMoney(total);
            document.getElementById("paid-amount-value").innerText = formatMoney(paid);
            document.getElementById("pending-amount-value").innerText = formatMoney(pending);
        }

        // Modal Handlers
        function openDateModal() {
            const dateModal = document.getElementById('date-modal');
            dateModal.classList.remove('hidden');
            
            const radio = document.querySelector(`input[name="fy-filter"][value="${currentFilter}"]`);
            if (radio) {
                radio.checked = true;
                handleRadioSelection(currentFilter);
            }

            setTimeout(() => document.body.classList.add('modal-open'), 10);
        }

        function closeDateModal() {
            document.body.classList.remove('modal-open');
            setTimeout(() => document.getElementById('date-modal').classList.add('hidden'), 300);
        }

        function handleRadioSelection(val) {
            document.querySelectorAll('.set-default-container').forEach(el => el.classList.add('hidden'));
            
            if (val !== defaultFilter) {
                const selectedOption = document.querySelector(`.filter-option[data-value="${val}"]`);
                if (selectedOption) {
                    const btnContainer = selectedOption.querySelector('.set-default-container');
                    if (btnContainer) btnContainer.classList.remove('hidden');
                }
            }
        }

        document.addEventListener('change', (e) => {
            if (e.target.name === 'fy-filter') {
                handleRadioSelection(e.target.value);
            }
        });

        function applyDateFilter() {
            const selectedRadio = document.querySelector('input[name="fy-filter"]:checked');
            if (selectedRadio) {
                currentFilter = selectedRadio.value;
                updateFilterDisplay();
                closeDateModal();
            }
        }

        function setDefaultAndApply(val) {
            defaultFilter = val;
            currentFilter = val;
            
            document.querySelectorAll('.default-tag').forEach(tag => tag.classList.add('hidden'));
            const parentOption = document.querySelector(`.filter-option[data-value="${val}"]`);
            if (parentOption) {
                const tagSpan = parentOption.querySelector('.default-tag');
                if (tagSpan) tagSpan.classList.remove('hidden');
                
                const btnContainer = parentOption.querySelector('.set-default-container');
                if (btnContainer) btnContainer.classList.add('hidden');
            }

            updateFilterDisplay();
            closeDateModal();
        }

        function updateFilterDisplay() {
            document.getElementById('display-fy').innerText = currentFilter;
            document.getElementById('empty-state-fy').innerText = currentFilter;
        }

        async function initBillPermissions() {
            try {
                const res = await fetch('/me');
                if (!res.ok) {
                    canManageBills = false;
                    return;
                }
                const data = await res.json();
                canManageBills = Boolean(data?.authenticated) && Boolean(data?.user?.is_active !== false);
            } catch (_) {
                canManageBills = false;
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await initBillPermissions();
            updateFilterDisplay();
            switchMainTab("sales");
        });
    </script>
</body>
</html>
